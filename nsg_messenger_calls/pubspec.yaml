name: nsg_messenger_calls
description: Optional voice/video calling for NSG Connect Messenger.
version: 0.0.1
publish_to: 'none'
environment:
  sdk: ^3.11.4
  flutter: ">=3.41.0"
dependencies:
  flutter:
    sdk: flutter
  nsg_messenger:
    path: ../nsg_messenger
  nsg_connect_client:
    path: ../nsg_connect_client
  # Keep >=1.6.1: older plugins contain a private iOS selector rejected by App Store.
  flutter_webrtc: ^1.6.1
  just_audio: ^0.9.40
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
flutter:
  assets:
    - assets/audio/ringback_connecting.wav
    - assets/audio/ringback_ringing.wav
